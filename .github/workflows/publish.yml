name: Publish to NPM & GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'NPM Tag (e.g. latest, beta)'
        required: false
        default: 'latest'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Verify Scaffolding & Build
        run: |
          mkdir -p /tmp/test-ci-publish
          node bin/vertigis-workflow-sdk.js create /tmp/test-ci-publish/sample-pack --no-skills
          cd /tmp/test-ci-publish/sample-pack
          npm run build
          test -f build/main.js
          test -f build/activitypack.json

      - name: Publish to Public NPM Registry
        run: |
          npm publish --access public --tag ${{ github.event.inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        continue-on-error: true
        run: |
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.name = '@geosynk-lab/' + pkg.name.split('/')[1]; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"
          npm config set //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}
          npm publish --registry https://npm.pkg.github.com/
